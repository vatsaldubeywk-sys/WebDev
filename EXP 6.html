<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEasy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f4f8;
      margin: 0;
      padding: 0;
    }

    .header {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 15px 0;
      font-size: 24px;
      font-weight: bold;
    }

    .product-card {
      width: 280px;
      background-color: white;
      margin: 40px auto;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: auto;
    }

    .product-info {
      padding: 15px;
    }

    .product-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product-desc {
      color: blueviolet;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price {
      font-size: 16px;
      color: #008000;
      font-weight: bold;
    }

    .old-price {
      text-decoration: line-through;
      color: #999;
      margin-left: 8px;
      font-size: 14px;
    }

    .btn {
      display: block;
      width: 90%;
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 10px;
      margin: 15px auto;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="header">SNAPDEAL</div>

  <div class="product-card">
    <img src="tim cheese.jpg" alt="T-Shirt">

    <div class="product-info">
      <div class="product-title">TIM CHEESE T-Shirt</div>
      <div class="product-desc">
        Soft, breathable cotton. Regular fit. Available in multiple colors.
      </div>
      <div>
        <span class="price">₹799</span>
        <span class="old-price">₹1,199</span>
      </div>
    </div>

    <button class="btn">Add to Cart</button>
  </div>

</body>
</html>
