<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 9: Responsive Product Grid</title>
    <style>
    body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: #f4f4f4;
    text-align: center;
}

h2 {
    color: #333;
}

.product-container {
    display: grid;
    gap: 20px;
    padding: 20px;
    grid-template-columns: repeat(4, 1fr);
}

.product-card {
    background-color: white;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    text-align: center;
}

.product-card img {
    width: 100%;
    height: auto;
    border-radius: 5px;
}

.price {
    font-weight: bold;
    color: #28a745;
}

@media (max-width: 1024px) {
    .product-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .product-container {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>
<body>

    <h2>Responsive Product Grid</h2>

    <div class="product-container">
        <div class="product-card">
            <img src="#" alt="Product 1">
            <h3>Product 1</h3>
            <p>High-quality item with great features</p>
            <p class="price">₹499</p>
        </div>

        <div class="product-card">
            <img src="#" alt="Product 2">
            <h3>Product 2</h3>
            <p>Durable and stylish for daily use</p>
            <p class="price">₹799</p>
        </div>

        <div class="product-card">
            <img src="#" alt="Product 3">
            <h3>Product 3</h3>
            <p>Lightweight and comfortable</p>
            <p class="price">₹1,299</p>
        </div>

        <div class="product-card">
            <img src="#" alt="Product 4">
            <h3>Product 4</h3>
            <p>Trendy design with premium quality</p>
            <p class="price">₹999</p>
        </div>
    </div>

</body>
</html>
