<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <header>
        <h1><center>STUDENT REGISTRATION FORM</center></h1>
        <hr> 
    </header>
       <form>
        <div><label for="username">Full Name</label>
        <input type="text" id="username" name="username" placeholder="Enter your username"></div>
        <br>
        <div><label for="email">Email</label>
        <input type="email" id="Email" name="email" placeholder="Enter your Email"></div>
        <br>
        <div><label for="Password">Password</label>
        <input type="password" name="password" placeholder="Enter your password"></div>
        <br>
        <div><label for="D.O.B.">Date Of Birth</label>
        <input type="date" name="date" placeholder="Enter your Date of Birth"></div>
        <br>
        <div><label for="gender">Gender</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label></div>
        <br>
        <div><label for="course">Course:</label>
        <select id="course" name="course">
        <option value="BTech">BTech</option>
        <option value="MBBS">MBBS</option>
        <option value="BBA">BBA</option>    
        </select></div>
        <br>
        <div><label for="phone number">Phone Number</label>
        <input type="number" id="phone number" name="phone number" placeholder="Phone Number"></div>  
        <br>
        <div>
        <textarea name="Address" rows="5" cols="50">
        Enter your address here...
        </textarea></div>
        <br>
        <div><input type="submit" value="Submit"> 
        <input type="reset" value="Reset"></div><hr>
