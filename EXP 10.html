<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        body {

        }
    .container {
        display: flex;

        display: flex;
        background-color: black;
        height: 50px;

    .two {
        display: flex;
        background-color: black;
        height: 50px;
        color: white;
        justify-content: center;
        align-items: center;
        gap: 25px;
        
    }
    .three {
        display: flex;
        background-color: black;
        height: 50px;
        color: white;
        justify-content: right;
        align-items: center;
        gap: 25px;
    }
   
    </style>
</head>
<body>
    <div class="container">
    <div class="one"><b>TEMU.</b></div>
    <div class="two">
    <div>Home</div>

    <div>Deals</div>
    <div>Contact</div>
    </div>
    <div class="three">
    <div>Cart</div>
    <div>Login</div>
    </div>
    </div>

    <h1>Welcome to TEMU!</h1>
    Your one-stop destination for all shopping needs.

</html>
