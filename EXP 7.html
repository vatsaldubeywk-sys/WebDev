<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>

    .Website{
    color: red;
}
.container{
    border: solid;
    padding-bottom: 10px;
}
.heading{
    background-color: lightgray;
    text-align: center;
    margin: auto;
    padding: 5px;
}
.list1{
    display: flex;
    justify-content: space-between;
    text-align: center;

}
ul li {
    display: inline-block;
    padding: 5px ;
    margin: 5px;
}

.top-nav li {
    background-color: lightblue;
    color: blue;
}
.bottom-nav li {
    background-color: lightgreen;
    color: green;

}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="heading">
        My <span class="Website"> website </span>navigation
      </div>

      <div class="list1">
        <ul class="top-nav">
          <li>Home</li>
          <li>About</li>
          <li>Services</li>
          <li>Contact</li>
        </ul>
      </div>

      <div class="list1">
        <ul class="bottom-nav">
          <li>Dashboard</li>
          <li>Profile</li>
          <li>Manger</li>
          <li>Logout</li>
        </ul>
      </div>
    </div>
  </body>
</html>
